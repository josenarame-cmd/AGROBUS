# Application
spring.application.name=AGROBUS
server.port=8080

# ── MySQL Database ─────────────────────────────────────────────────────────────
# Override these via environment variables or application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/agrobus_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ── JWT ────────────────────────────────────────────────────────────────────────
# REQUIRED: Set JWT_SECRET environment variable in production.
# Never rely on the fallback in a deployed environment.
jwt.secret=${JWT_SECRET:agrobus-dev-secret-key-replace-in-production-minimum-32-chars}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ── CORS ───────────────────────────────────────────────────────────────────────
spring.web.cors.allowed-origins=http://localhost:5173,http://localhost:3000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors.allowed-headers=*

# ── File Upload ────────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── Google OAuth2 ───────────────────────────────────────────────────────────────
# IMPORTANT: Move client-id and client-secret to environment variables or
# application-local.properties (gitignored). Never commit real secrets.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri="http://localhost:8080/login/oauth2/code/google"
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
